<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вхід</title>
    <style>
        :root {
            --bg: #eef1f4;
            --surface: #ffffff;
            --surface-muted: #f6f7f9;
            --ink: #1f2933;
            --muted: #667085;
            --line: #d8dde5;
            --accent: #1f5f57;
            --danger: #b42318;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 16px;
            background: var(--bg);
            color: var(--ink);
            font-family: "Segoe UI", "Aptos", sans-serif;
            line-height: 1.4;
        }

        .login-shell {
            width: min(100%, 420px);
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            padding: 16px;
        }

        .eyebrow {
            margin: 0 0 4px;
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 22px;
            line-height: 1.2;
        }

        p {
            margin: 0 0 14px;
            color: var(--muted);
            font-size: 13px;
        }

        form {
            display: grid;
            gap: 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 13px;
        }

        input {
            width: 100%;
            min-height: 36px;
            padding: 6px 9px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--surface);
            color: var(--ink);
            font: inherit;
        }

        button {
            min-height: 36px;
            padding: 6px 10px;
            border: 1px solid var(--accent);
            border-radius: 6px;
            background: var(--accent);
            color: #ffffff;
            cursor: pointer;
            font: inherit;
        }

        ul,
        .errorlist {
            margin: 6px 0 0;
            padding-left: 18px;
            color: var(--danger);
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="login-shell">
    <p class="eyebrow">MK CRM</p>
    <h1>Вхід</h1>
    <p>Увійдіть за email або логіном, щоб відкрити робочі модулі системи.</p>
    <form method="post">
        {% csrf_token %}
        {% if form.non_field_errors %}
            {{ form.non_field_errors }}
        {% endif %}
        {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}
        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}
        <button type="submit">Увійти</button>
    </form>
</div>
</body>
</html>
