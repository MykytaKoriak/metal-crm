<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вхід</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at top right, rgba(100, 57, 36, 0.18), transparent 28%),
                linear-gradient(180deg, #f3efe6 0%, #ece6db 100%);
            font-family: Georgia, "Times New Roman", serif;
            color: #1f2a30;
        }

        .card {
            width: min(100%, 420px);
            margin: 20px;
            padding: 28px;
            border-radius: 24px;
            background: rgba(255, 253, 249, 0.96);
            border: 1px solid #d9d0c3;
            box-shadow: 0 14px 40px rgba(31, 42, 48, 0.12);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 34px;
        }

        p {
            color: #5f6b72;
        }

        form {
            display: grid;
            gap: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid #cfc4b5;
            background: #fff;
            font: inherit;
        }

        button {
            padding: 12px 16px;
            border: 0;
            border-radius: 14px;
            background: #8b5e34;
            color: #fff;
            font: inherit;
            cursor: pointer;
        }

        ul {
            margin: 0;
            padding-left: 18px;
            color: #b63d2b;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Вхід</h1>
    <p>Увійдіть за email або логіном, щоб відкрити персональний кабінет.</p>
    <form method="post">
        {% csrf_token %}
        {% if form.non_field_errors %}
            {{ form.non_field_errors }}
        {% endif %}
        {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}
        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}
        <button type="submit">Увійти</button>
    </form>
</div>
</body>
</html>
