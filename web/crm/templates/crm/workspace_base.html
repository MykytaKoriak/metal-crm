{% extends "core/dashboard_base.html" %}

{% block extra_head %}
    <style>
        .toolbar {
            display: grid;
            gap: 10px;
        }

        .toolbar > a {
            justify-self: start;
        }

        .toolbar a,
        .board-actions a,
        .search-form a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            padding: 6px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface-muted);
            text-decoration: none;
            font-size: 13px;
        }

        .search-form {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        }

        .search-form input,
        .search-form select,
        .search-form button {
            width: 100%;
            min-width: 0;
            min-height: 34px;
            padding: 6px 9px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--surface);
            color: var(--ink);
            font-size: 13px;
        }

        .search-form button {
            cursor: pointer;
            background: var(--surface-muted);
        }

        .card-grid {
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }

        .meta-line {
            color: var(--muted);
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 3px 8px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--surface-muted);
            font-size: 12px;
            color: var(--muted);
        }

        @media (max-width: 760px) {
            .search-form {
                grid-template-columns: 1fr;
            }
        }
    </style>
    {% block crm_extra_head %}{% endblock %}
{% endblock %}
