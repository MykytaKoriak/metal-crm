{% extends "admin/base_site.html" %}

{% block content %}
<style>
    .calendar-shell {
        max-width: 1360px;
        padding: 8px 0 24px;
    }

    .calendar-shell h1 {
        margin-bottom: 12px;
    }

    .calendar-panel {
        padding: 12px;
        border: 1px solid #d6dfe3;
        border-radius: 8px;
        background: #fff;
    }

    #calendar {
        background: #fff;
        border-radius: 6px;
    }
</style>

<div class="calendar-shell">
    <h1>Календар слотів виробництва</h1>
    <div class="calendar-panel">
        <div id="calendar"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  var calendarEl = document.getElementById("calendar");

  var calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: "timeGridWeek",
    locale: "uk",
    firstDay: 1,
    nowIndicator: true,
    slotMinTime: "00:00:00",
    slotMaxTime: "24:00:00",
    height: "auto",
    timeZone: "Europe/Kyiv",
    headerToolbar: {
      left: "prev,next today",
      center: "title",
      right: "dayGridMonth,timeGridWeek,timeGridDay"
    },
    events: "{% url 'production_slot_events' %}",
    selectable: {{ can_add_slots|yesno:"true,false" }},
    select: function(info) {
      if (!{{ can_add_slots|yesno:"true,false" }}) {
        return;
      }
      const start = info.startStr;
      const end = info.endStr;
      const url = `/admin/manufacture/productionslot/add/?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`;
      window.location.href = url;
    },
    eventClick: function(info) {
      if (!{{ can_view_slots|yesno:"true,false" }}) {
        return;
      }
      if (info.event.extendedProps.kind !== "slot") {
        return;
      }
      const url = `/admin/manufacture/productionslot/${info.event.id}/change/`;
      window.location.href = url;
    }
  });

  calendar.render();
});
</script>
{% endblock %}
